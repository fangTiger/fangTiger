<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 760 300">
  <title>Captain Dock project card</title>
  <desc>Project card for captain-dock, described as a personal command deck for AI Web3 projects in active development.</desc>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: Inter, Arial, Helvetica, sans-serif; }
    .pulse { animation: pulse 4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="cardDock" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0B0F14"/>
      <stop offset=".7" stop-color="#141C24"/>
      <stop offset="1" stop-color="#1A2028"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="744" height="284" rx="8" fill="url(#cardDock)" stroke="#2A3542" stroke-width="2"/>
  <path d="M32 62H728M32 238H728" stroke="#2A3542" stroke-width="1"/>
  <g transform="translate(512 76)">
    <rect x="0" y="0" width="178" height="138" rx="6" fill="#101820" stroke="#334252"/>
    <path d="M18 42H160M18 76H160M18 110H160" stroke="#2A3542" stroke-width="2"/>
    <path class="pulse" d="M28 108L68 72L105 88L150 36" fill="none" stroke="#66E3FF" stroke-width="5" stroke-linecap="round"/>
    <circle cx="150" cy="36" r="8" fill="#FF7A18"/>
  </g>
  <text class="mono" x="42" y="48" fill="#FF7A18" font-size="18">ACTIVE DEVELOPMENT</text>
  <text class="sans" x="42" y="116" fill="#F4FBFF" font-size="46" font-weight="800">captain-dock</text>
  <text class="sans" x="42" y="158" fill="#C4D4DF" font-size="24">Personal command deck for</text>
  <text class="sans" x="42" y="190" fill="#C4D4DF" font-size="24">AI × Web3 projects.</text>
  <rect x="42" y="222" width="264" height="34" rx="4" fill="#101820" stroke="#334252"/>
  <text class="mono" x="60" y="244" fill="#66E3FF" font-size="15">portfolio · project command</text>
</svg>
