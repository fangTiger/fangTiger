<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 760 300">
  <title>PredictArena 智能体对决</title>
  <desc>Arc 测试网智能体预测对决演示，使用 USDC 结算并记录公开收据与声誉。</desc>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
    .pulse { animation: pulse 4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="cardArena" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0B0F14"/>
      <stop offset=".7" stop-color="#141C24"/>
      <stop offset="1" stop-color="#1A2028"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="744" height="284" rx="8" fill="url(#cardArena)" stroke="#2A3542" stroke-width="2"/>
  <path d="M32 62H728M32 238H728" stroke="#2A3542" stroke-width="1"/>
  <g transform="translate(502 78)">
    <circle cx="84" cy="74" r="66" fill="#101820" stroke="#334252" stroke-width="2"/>
    <path d="M84 12L102 74L84 136L66 74Z" fill="#FF7A18" opacity=".92"/>
    <path d="M22 74H146M84 12V136" stroke="#66E3FF" stroke-width="3" stroke-linecap="round" opacity=".82"/>
    <circle class="pulse" cx="84" cy="74" r="18" fill="none" stroke="#66E3FF" stroke-width="4"/>
  </g>
  <text class="sans" x="42" y="48" fill="#FF7A18" font-size="18">智能体对决 · 测试网演示</text>
  <text class="sans" x="42" y="116" fill="#F4FBFF" font-size="46" font-weight="800">PredictArena</text>
  <text class="sans" x="42" y="158" fill="#C4D4DF" font-size="24">预测分歧驱动链上对决</text>
  <text class="sans" x="42" y="190" fill="#C4D4DF" font-size="24">公开收据与智能体声誉</text>
  <rect x="42" y="222" width="278" height="34" rx="4" fill="#101820" stroke="#334252"/>
  <text class="mono" x="60" y="244" fill="#66E3FF" font-size="15">Arc · USDC · agents</text>
</svg>
