<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 760 300">
  <title>Large Model Template card</title>
  <desc>Project card for large model templates, focused on agent prompts, tool calls and reusable AI workflows.</desc>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: Inter, Arial, Helvetica, sans-serif; }
    .pulse { animation: pulse 4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="cardLlmTemplate" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0B0F14"/>
      <stop offset=".7" stop-color="#141C24"/>
      <stop offset="1" stop-color="#1A2028"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="744" height="284" rx="8" fill="url(#cardLlmTemplate)" stroke="#2A3542" stroke-width="2"/>
  <path d="M32 62H728M32 238H728" stroke="#2A3542" stroke-width="1"/>
  <g transform="translate(500 72)">
    <rect x="0" y="0" width="178" height="142" rx="8" fill="#101820" stroke="#334252" stroke-width="2"/>
    <path d="M28 38H150M28 70H126M28 102H158" stroke="#2A3542" stroke-width="8" stroke-linecap="round"/>
    <path class="pulse" d="M28 38H112M28 70H92M28 102H136" stroke="#66E3FF" stroke-width="5" stroke-linecap="round"/>
    <circle cx="148" cy="70" r="12" fill="#FF7A18"/>
    <path d="M136 70H160M148 58V82" stroke="#0B0F14" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text class="mono" x="42" y="48" fill="#FF7A18" font-size="18">LLM TEMPLATE</text>
  <text class="sans" x="42" y="116" fill="#F4FBFF" font-size="44" font-weight="800">Large Model</text>
  <text class="sans" x="42" y="158" fill="#F4FBFF" font-size="44" font-weight="800">Template</text>
  <text class="sans" x="42" y="196" fill="#C4D4DF" font-size="23">Agent prompt, tool-call and</text>
  <text class="sans" x="42" y="226" fill="#C4D4DF" font-size="23">workflow templates.</text>
  <rect x="42" y="244" width="245" height="34" rx="4" fill="#101820" stroke="#334252"/>
  <text class="mono" x="60" y="266" fill="#66E3FF" font-size="15">prompts · tools · workflows</text>
</svg>
